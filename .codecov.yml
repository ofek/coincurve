comment:
  layout: "diff, files"
  behavior: default

coverage:
  range: 50..100
  round: down
  precision: 2

  status:
    project:
      default: false
      python:
        target: '70'
        flags:
        - python
      native:
        target: '70'
        flags:
        - native
        informational: true
    patch:
      default: false
      python:
        target: '70'
        flags:
        - python
      native:
        target: '70'
        flags:
        - native
        informational: true
