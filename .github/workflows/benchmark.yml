name: benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    name: Benchmark ${{ matrix.revision }} on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        revision: [cffi-baseline, rewrite]
        python-version: ['3.10', '3.14', '3.14t']

    steps:
    - uses: actions/checkout@v7
      with:
        path: harness

    - uses: actions/checkout@v7
      with:
        ref: ${{ matrix.revision == 'cffi-baseline' && '2d11b1160c75ae8fd94fe8fe3f226aec176bf9bf' || github.sha }}
        path: source

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install benchmark target
      run: python -m pip install ./source pyperf

    - name: Run CFFI baseline benchmarks
      if: matrix.revision == 'cffi-baseline'
      run: python harness/scripts/bench_cffi_baseline.py --output benchmark.json --rigorous

    - name: Run rewrite benchmarks
      if: matrix.revision == 'rewrite'
      run: python harness/scripts/bench.py --output benchmark.json --rigorous

    - uses: actions/upload-artifact@v7
      with:
        name: benchmark-${{ matrix.revision }}-python-${{ matrix.python-version }}
        path: benchmark.json
        if-no-files-found: error
