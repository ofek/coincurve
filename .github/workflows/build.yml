name: build

on:
  push:
    tags:
    - v*
    branches:
    - master
  pull_request:
    branches:
    - master

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: '3.14'
  COINCURVE_IGNORE_SYSTEM_LIB: 'ON'
  COINCURVE_SECP256K1_STATIC: 'ON'
  COINCURVE_CROSS_HOST: ''
  COINCURVE_STRICT_WARNINGS: 'ON'
  CIBW_ENVIRONMENT_PASS_LINUX: >
    COINCURVE_IGNORE_SYSTEM_LIB
    COINCURVE_SECP256K1_STATIC
    COINCURVE_CROSS_HOST
    COINCURVE_STRICT_WARNINGS
  CIBW_BEFORE_ALL_MACOS: ./.github/scripts/install-macos-build-deps.sh
  CIBW_TEST_REQUIRES: pytest
  CIBW_TEST_COMMAND: >
    python -c
    "from coincurve import PrivateKey;
    a=PrivateKey();
    b=PrivateKey();
    assert a.ecdh(b.public_key.format())==b.ecdh(a.public_key.format())
    " &&
    python -m pytest {project}

jobs:
  quality:
    name: Static analysis and types
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - uses: astral-sh/setup-uv@v9.0.0

    - name: Install Hatch
      uses: pypa/hatch@install

    - name: Check code
      run: hatch check code

    - name: Check formatting
      run: hatch check fmt

    - name: Check types
      run: hatch run types:check

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ startsWith(matrix.os, 'macos-') && 'macOS' || startsWith(matrix.os, 'windows-') && 'Windows' || 'Linux' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      if: runner.os == 'macOS'
      run: ./.github/scripts/install-macos-build-deps.sh

    - name: Install project and test dependencies
      run: python -m pip install . pytest pytest-randomly

    - name: Run tests
      run: python -m pytest tests

  system-library:
    name: Test with system libsecp256k1
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.12'
      COINCURVE_UPSTREAM_REF: __no_upstream__
      COINCURVE_IGNORE_SYSTEM_LIB: 'OFF'
      COINCURVE_SECP256K1_STATIC: 'OFF'
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - uses: actions/checkout@v7

    - name: Install Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        environment-file: ./.conda/environment-dev.yml
        activate-environment: coincurve-with-conda-dev
        python-version: ${{ env.PYTHON_VERSION }}
        auto-activate-base: false

    - name: Build wheel
      run: |
        python -m pip install build
        python -m build --wheel --outdir system-dist

    - name: Install wheel and run tests
      run: |
        python -m pip install --no-deps system-dist/*.whl
        LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" python -m pytest tests

  shared-library:
    name: Test shared libsecp256k1 on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    env:
      COINCURVE_SECP256K1_STATIC: 'OFF'
      CIBW_BUILD: 'cp314-*'
      CIBW_ARCHS: ${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos-target }}
      # The shared Windows wheel already installs libsecp256k1 beside the extension.
      # Delvewheel only searches outside the wheel for that dependency, so preserve
      # the already self-contained wheel instead of trying to vendor it a second time.
      CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
        python -c "import shutil; shutil.copy2(r'{wheel}', r'{dest_dir}')"
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: Linux
          os: ubuntu-latest
          arch: x86_64
          macos-target: ''
        - platform: macOS
          os: macos-15-intel
          arch: x86_64
          macos-target: '10.15'
        - platform: Windows
          os: windows-latest
          arch: AMD64
          macos-target: ''

    steps:
    - uses: actions/checkout@v7

    - name: Build and test wheel
      uses: pypa/cibuildwheel@v4.1.0
      env:
        CIBW_BEFORE_ALL_WINDOWS: choco install -y --no-progress --no-color cmake>=3.28

  coverage:
    name: Measure Python coverage
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.14t'

    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Hatch
      uses: pypa/hatch@install

    - name: Run tests with coverage
      run: hatch test --python ${{ env.PYTHON_VERSION }} --cover-quiet --randomize

    - name: Create coverage report
      run: hatch run hatch-test.py${{ env.PYTHON_VERSION }}:coverage xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: coverage.xml
        flags: python
        use_oidc: true

  native-coverage:
    name: Measure project C coverage
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - uses: astral-sh/setup-uv@v9.0.0

    - name: Install LLVM coverage tools
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends clang llvm

    - name: Install Hatch
      uses: pypa/hatch@install

    - name: Measure native coverage
      run: hatch run native-coverage:run

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: build/native-coverage/coverage.lcov
        flags: native
        use_oidc: true

    - name: Upload native coverage report
      uses: actions/upload-artifact@v7
      with:
        name: native-coverage-report
        path: build/native-coverage
        if-no-files-found: error

  sanitizers:
    name: Test project C sources with sanitizers
    runs-on: ubuntu-latest
    env:
      COINCURVE_SANITIZE: 'ON'

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install project and test dependencies
      run: python -m pip install . pytest

    - name: Run tests under AddressSanitizer and UndefinedBehaviorSanitizer
      run: LD_PRELOAD="$(cc -print-file-name=libasan.so)" python -m pytest tests

  sdist:
    name: Build source distribution
    needs:
    - quality
    - test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install build dependencies
      run: python -m pip install build

    - name: Build source distribution
      run: python -m build --sdist

    - uses: actions/upload-artifact@v7
      with:
        name: artifact-sdist
        path: dist/*
        if-no-files-found: error

  prerelease-source:
    name: Test sdist on Python ${{ matrix.python.version }} on ${{ startsWith(matrix.os, 'macos-') && 'macOS' || startsWith(matrix.os, 'windows-') && 'Windows' || 'Linux' }}
    needs:
    - sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python:
        - version: 3.15-dev
          free-threaded: false
        - version: 3.15t-dev
          free-threaded: true

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python.version }}
        check-latest: true

    - name: Verify prerelease interpreter
      env:
        EXPECTED_FREE_THREADED: ${{ matrix.python.free-threaded }}
      run: python scripts/check_prerelease_python.py

    - uses: actions/download-artifact@v8
      with:
        name: artifact-sdist
        path: dist

    - name: Install source distribution
      run: >
        python -c
        "import subprocess, sys;
        from pathlib import Path;
        sdists=list(Path('dist').glob('*.tar.gz'));
        assert len(sdists)==1, sdists;
        subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'pytest', 'pytest-randomly', str(sdists[0])])"

    - name: Run tests
      run: python -m pytest tests

  linux-wheels-x86_64:
    name: Build Linux wheels for x86-64
    needs:
    - quality
    - test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Build wheels
      uses: pypa/cibuildwheel@v4.1.0
      env:
        CIBW_ARCHS_LINUX: x86_64

    - uses: actions/upload-artifact@v7
      with:
        name: artifact-linux-wheels-x86_64
        path: wheelhouse/*.whl
        if-no-files-found: error

  linux-wheels-arm64:
    name: Build Linux wheels for ARM64
    needs:
    - quality
    - test
    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v7

    - name: Build wheels
      uses: pypa/cibuildwheel@v4.1.0
      env:
        CIBW_ARCHS_LINUX: aarch64

    - uses: actions/upload-artifact@v7
      with:
        name: artifact-linux-wheels-arm64
        path: wheelhouse/*.whl
        if-no-files-found: error

  macos-wheels-x86_64:
    name: Build macOS wheels for x86-64
    needs:
    - quality
    - test
    runs-on: macos-15-intel

    steps:
    - uses: actions/checkout@v7

    - name: Build wheels
      uses: pypa/cibuildwheel@v4.1.0
      env:
        CIBW_ARCHS_MACOS: x86_64
        MACOSX_DEPLOYMENT_TARGET: '10.15'

    - uses: actions/upload-artifact@v7
      with:
        name: artifact-macos-wheels-x86_64
        path: wheelhouse/*.whl
        if-no-files-found: error

  macos-wheels-arm64:
    name: Build macOS wheels for ARM64
    needs:
    - quality
    - test
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7

    - name: Build wheels
      uses: pypa/cibuildwheel@v4.1.0
      env:
        CIBW_ARCHS_MACOS: arm64

    - uses: actions/upload-artifact@v7
      with:
        name: artifact-macos-wheels-arm64
        path: wheelhouse/*.whl
        if-no-files-found: error

  windows-wheels-x86_64:
    name: Build Windows wheels for x86-64
    needs:
    - quality
    - test
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Build wheels
      uses: pypa/cibuildwheel@v4.1.0
      env:
        CIBW_ARCHS_WINDOWS: AMD64
        CIBW_BEFORE_ALL: choco install -y --no-progress --no-color cmake>=3.28

    - uses: actions/upload-artifact@v7
      with:
        name: artifact-windows-wheels-x86_64
        path: wheelhouse/*.whl
        if-no-files-found: error

  windows-wheels-arm64:
    name: Build Windows wheels for ARM64
    needs:
    - quality
    - test
    runs-on: windows-11-arm

    steps:
    - uses: actions/checkout@v7

    - name: Build wheels
      uses: pypa/cibuildwheel@v4.1.0
      env:
        CIBW_ARCHS_WINDOWS: ARM64
        CIBW_BEFORE_ALL: choco install -y --no-progress --no-color cmake>=3.28

    - uses: actions/upload-artifact@v7
      with:
        name: artifact-windows-wheels-arm64
        path: wheelhouse/*.whl
        if-no-files-found: error

  validate-distribution:
    name: Validate release artifacts
    needs:
    - system-library
    - shared-library
    - prerelease-source
    - linux-wheels-x86_64
    - linux-wheels-arm64
    - macos-wheels-x86_64
    - macos-wheels-arm64
    - windows-wheels-x86_64
    - windows-wheels-arm64
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/download-artifact@v8
      with:
        pattern: artifact-*
        merge-multiple: true
        path: dist

    - name: Install validation tools
      run: python -m pip install "packaging>=24.2" check-wheel-contents twine

    - name: Validate metadata and wheel contents
      run: |
        python -m twine check --strict dist/*
        check-wheel-contents dist/*.whl

    - name: Validate artifact inventory
      run: python scripts/check_dist.py dist

  publish:
    name: Publish release
    needs:
    - validate-distribution
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')

    permissions:
      id-token: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: artifact-*
        merge-multiple: true
        path: dist

    - name: Push build artifacts to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.0
      with:
        skip-existing: true
