name: conda_build

on:
  push:
    tags:
    - v*
    branches:
    - master
  pull_request:
    branches:
    - master

concurrency:
  group: conda-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: '3.12'
  COINCURVE_UPSTREAM_REF: __no_upstream__
  COINCURVE_IGNORE_SYSTEM_LIB: 'OFF'
  COINCURVE_SECP256K1_STATIC: 'OFF'
  COINCURVE_CROSS_HOST: ''

jobs:
  test:
    name: Test with Conda libsecp256k1
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - uses: actions/checkout@v7

    - name: Install Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        environment-file: ./.conda/environment-dev.yml
        activate-environment: coincurve-with-conda
        python-version: ${{ env.PYTHON_VERSION }}
        auto-activate-base: false

    - name: Install Hatch
      uses: pypa/hatch@install

    - name: Run tests
      run: LD_LIBRARY_PATH="$CONDA_PREFIX/lib" hatch test --python "$PYTHON_VERSION" --randomize

  linux-wheels-x86_64:
    name: Build Linux wheels
    needs:
    - test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - uses: actions/checkout@v7

    - name: Install Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        environment-file: ./.conda/environment-dev.yml
        activate-environment: coincurve-with-conda
        python-version: ${{ env.PYTHON_VERSION }}
        auto-activate-base: false

    - name: Build sdist & wheel
      run: |
        conda install python-build
        python -m build --outdir conda_dist

    - name: Test wheel in a clean environment
      run: |
        conda install pip
        pip install conda_dist/*.whl
        python -m pytest tests
