[envs.default]
installer = "uv"
dev-mode = false

[envs.hatch-static-analysis]
config-path = "ruff_defaults.toml"

[envs.hatch-check-code]
installer = "uv"
dependencies = ["ruff==0.13.0"]

[envs.hatch-check-code.scripts]
lint-check = "ruff check {args:.}"
lint-fix = "ruff check --fix {args:.}"

[envs.hatch-check-fmt]
installer = "uv"
dependency-groups = ["format"]
dependencies = ["ruff==0.13.0"]

[envs.hatch-check-fmt.scripts]
format-check = [
  "ruff format --check --diff {args:.}",
  "python \"{root}{/}scripts{/}check_clang_format.py\"",
]
format-fix = [
  "ruff format {args:.}",
  "python \"{root}{/}scripts{/}check_clang_format.py\" --fix",
]

[envs.hatch-test]
dev-mode = false

[[envs.hatch-test.matrix]]
python = ["3.14t", "3.14", "3.13", "3.12", "3.11", "3.10"]

[envs.native-coverage]
installer = "uv"
skip-install = true
dependency-groups = ["native-coverage"]

[envs.native-coverage.env-vars]
COINCURVE_COVERAGE = "ON"
SKBUILD_INSTALL_STRIP = "false"

[envs.native-coverage.scripts]
run = [
  "uv pip install --no-cache --reinstall --no-deps .",
  "python scripts/native_coverage.py {args:tests}",
]

[envs.native-coverage.overrides]
platform.linux.env-vars = "CC=clang"
platform.macos.env-vars = "CC=clang"
platform.windows.env-vars = [
  "CC=clang-cl",
  "CMAKE_GENERATOR=Ninja",
]

[envs.types]
dependencies = [
  "mypy",
  "pytest",
]
[envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/coincurve tests}"

[envs.docs]
dependencies = [
  "mkdocs~=1.6.1",
  "mkdocs-material~=9.5.40",
  # Plugins
  "mkdocs-minify-plugin~=0.8.0",
  "mkdocs-git-revision-date-localized-plugin~=1.2.9",
  "mkdocs-glightbox~=0.4.0",
  "mkdocs-redirects~=1.2.1",
  "mkdocstrings-python~=1.16.2",
  "mike~=2.1.3",
  # Extensions
  "pymdown-extensions~=10.11.2",
  # Necessary for syntax highlighting in code blocks
  "pygments~=2.18.0",
  # Validation
  "linkchecker~=10.5.0",
]
[envs.docs.env-vars]
SOURCE_DATE_EPOCH = "1580601600"
PYTHONUNBUFFERED = "1"
[envs.docs.scripts]
build = "mkdocs build --clean --strict {args}"
serve = "mkdocs serve --dev-addr localhost:8000 {args}"
ci-build = "mike deploy --update-aliases {args}"
validate = "linkchecker --config .linkcheckerrc site"
# https://github.com/linkchecker/linkchecker/issues/678
build-check = [
  "build --no-directory-urls",
  "validate",
]
